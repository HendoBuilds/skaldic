<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="skbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1f12"/>
      <stop offset="100%" stop-color="#0e0a05"/>
    </linearGradient>
    <linearGradient id="skgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbe7a8"/>
      <stop offset="50%" stop-color="#e2b659"/>
      <stop offset="100%" stop-color="#a37e39"/>
    </linearGradient>
  </defs>

  <!-- backplate -->
  <rect x="40" y="40" width="944" height="944" rx="210" fill="url(#skbg)"/>
  <rect x="82" y="82" width="860" height="860" rx="172" fill="none" stroke="#e2b659" stroke-width="20" stroke-opacity="0.8"/>

  <!-- bold lute: sharp runic pegbox + neck + big body, heavy outline for contrast -->
  <g stroke="#140e06" stroke-width="24" stroke-linejoin="round">
    <path d="M 424 286 L 400 148 L 512 98 L 624 148 L 600 286 Z" fill="url(#skgold)"/>
    <rect x="462" y="250" width="100" height="372" rx="18" fill="url(#skgold)"/>
    <circle cx="512" cy="650" r="288" fill="url(#skgold)"/>
  </g>

  <!-- sound hole -->
  <circle cx="512" cy="650" r="102" fill="#0e0a05"/>
  <circle cx="512" cy="650" r="102" fill="none" stroke="#a37e39" stroke-width="16"/>
</svg>
